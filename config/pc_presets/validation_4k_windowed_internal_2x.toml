# Consolidated internal-2x validation profile, not a promoted playable baseline.
# V162 Probes276/277 prove native-grid RGB-table parity; full physical
# title/menu/gameplay and character/effect fidelity remain pending.
# Requests3840x2160 WINDOWED output; verify the actual backing surface/DPI path
# in the startup snapshot. The attached display is2560x1440, NOT physical4K
# or DSR/VSR. Scene buffers remain2560x1440 (2x), not internal4K.

pc_config_version = 1
output_resolution = "4k"
window_width = 0
window_height = 0
fullscreen = false
window_mode = "windowed"
monitor = 0
resolution_scale = 2
draw_resolution_scale_threshold = 640
# Verified data-pass semantic annotations, not user-adjustable image effects.
draw_resolution_scale_native_grid_rules = "B29F0BF45937C4C4:FDC5E32EC6045BE1:1:324:18:6;B29F0BF45937C4C4:37AC93F53126ABB7:0:324:18:26;B29F0BF45937C4C4:54D655FC471D594A:0:324:18:26;B29F0BF45937C4C4:69779AD07425E356:0:324:18:26;B29F0BF45937C4C4:FAE3BACA27F09CC9:0:1280:720:6:filter;B29F0BF45937C4C4:FAE3BACA27F09CC9:0:1280:720:26:filter;B29F0BF45937C4C4:9F1D2D64E5F75924:0:1280:720:26:filter;B29F0BF45937C4C4:9F1D2D64E5F75924:0:160:90:6:filter;B29F0BF45937C4C4:8F96D5C280D780BC:0:1280:720:26:filter;EC4685ADB9CCBC13:207D40E674A7C916:0:1280:720:26:filter_scaled:source=native;4FA9486610B42A92:22FC55CE134777AC:1:1280:720:26:filter_scaled:source=native;4FA9486610B42A92:A59B41D0BD79484B:1:1280:720:26:filter_scaled:source=native"
native_resolve_region_tracking = true
swap_post_effect = "fxaa_extreme"
anisotropic_override = 5

[general]
language = "english"

[graphics]
motion_blur = false
motion_blur_off_shader_pack = ""
hd_textures = false
temporal_aa = "off"
msaa_mode = "4x"

[present]
effect = "bilinear"
letterbox = true
allow_overscan_cutoff = false
safe_area_x = 100
safe_area_y = 100

[display]
# This requests VRR eligibility; actual monitor engagement requires validation.
# Unsupported tearing falls back to synchronized VSync.
present_mode = "vrr"
max_frame_latency = 1
low_latency = "on"
# Host refresh/presentation settings do not unlock the guest simulation rate.
frame_limit = 0
frame_rate = "original"
menu_frame_rate = "reduced"
widescreen = false

[camera]
field_of_view = 86.0

[audio]
master_volume = 1.0

[input]
keyboard_mouse = true
keyboard_mouse_user_index = 0
mouse_sensitivity = 1.0
mouse_acceleration = 0.0
mouse_smoothing = 0.0
mouse_invert_y = false
button_prompts = "auto"
mouse_look = "native"
overlay_key = "F1"
controller_sensitivity = "medium"
controller_invert_y = false
vibration_scale = 1.0

[diagnostics]
camera_state = false
