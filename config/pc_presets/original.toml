# Original (console look)
# Native desktop output with the console's internal 1280 x 720 scene, no
# post anti-aliasing, 4x texture filtering, the title's motion blur, its
# 95 degree view and its own 30 FPS pacing. Keyboard and mouse stay available.
pc_config_version = 1
output_resolution = "native"
window_width = 0
window_height = 0
fullscreen = true
window_mode = "borderless"
monitor = 0

resolution_scale = 1
# Title data-pass annotations that internal scaling requires (not settings).
draw_resolution_scale_threshold = 640
draw_resolution_scale_native_grid_rules = "B29F0BF45937C4C4:FDC5E32EC6045BE1:1:324:18:6;B29F0BF45937C4C4:37AC93F53126ABB7:0:324:18:26;B29F0BF45937C4C4:54D655FC471D594A:0:324:18:26;B29F0BF45937C4C4:69779AD07425E356:0:324:18:26;B29F0BF45937C4C4:FAE3BACA27F09CC9:0:1280:720:6:filter_scaled;B29F0BF45937C4C4:FAE3BACA27F09CC9:0:1280:720:26:filter_scaled;B29F0BF45937C4C4:9F1D2D64E5F75924:0:1280:720:26:filter_scaled;B29F0BF45937C4C4:9F1D2D64E5F75924:0:160:90:6:filter_scaled;B29F0BF45937C4C4:8F96D5C280D780BC:0:1280:720:26:filter_scaled;EC4685ADB9CCBC13:207D40E674A7C916:0:1280:720:26:filter_scaled:source=native;4FA9486610B42A92:22FC55CE134777AC:1:1280:720:26:filter_scaled:source=native;4FA9486610B42A92:A59B41D0BD79484B:1:1280:720:26:filter_scaled:source=native"
native_resolve_region_tracking = true
swap_post_effect = "none"
anisotropic_override = 3

[general]
language = "auto"

[graphics]
motion_blur = true
motion_blur_off_shader_pack = ""
hd_textures = false
temporal_aa = "off"

[present]
effect = "bilinear"
letterbox = true
allow_overscan_cutoff = false
safe_area_x = 100
safe_area_y = 100

[display]
# VSync never tears; G-SYNC/FreeSync displays still follow the frame rate.
present_mode = "vsync"
max_frame_latency = 1
low_latency = "on"
frame_limit = 0
frame_rate = "original"
menu_frame_rate = "reduced"
widescreen = false

[camera]
field_of_view = 86.0

[audio]
master_volume = 1.0

[input]
keyboard_mouse = true
keyboard_mouse_user_index = 0
mouse_sensitivity = 1.0
mouse_acceleration = 0.0
mouse_smoothing = 0.0
mouse_invert_y = false
button_prompts = "auto"
mouse_look = "native"
overlay_key = "F1"
controller_sensitivity = "medium"
controller_invert_y = false
vibration_scale = 1.0

[diagnostics]
camera_state = false
