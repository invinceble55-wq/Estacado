# PC Enhanced 1440p validation preset
# Uses a 2560x1440 host output while preserving the verified 1280x720 guest
# render. Internal ReXGlue scaling is intentionally disabled: deterministic
# Probes 91-104 proved scale 2 corrupts this title's screen-space composition.
# The host VRR path falls back to synchronized VSync when unavailable.
pc_config_version = 1
output_resolution = "1440p"
window_width = 0
window_height = 0
fullscreen = true
window_mode = "borderless"
monitor = 0

resolution_scale = 1
swap_post_effect = "fxaa_extreme"
anisotropic_override = 5

[general]
language = "english"

[graphics]
motion_blur = false
motion_blur_off_shader_pack = ""
hd_textures = false
temporal_aa = "off"
msaa_mode = "4x"

[present]
effect = "bilinear"
letterbox = true
allow_overscan_cutoff = false
safe_area_x = 100
safe_area_y = 100

[display]
present_mode = "vrr"
max_frame_latency = 1
low_latency = "on"
frame_limit = 0
frame_rate = "original"
menu_frame_rate = "reduced"
widescreen = false

[camera]
field_of_view = 86.0

[audio]
master_volume = 1.0

[input]
keyboard_mouse = true
keyboard_mouse_user_index = 0
mouse_sensitivity = 1.0
mouse_acceleration = 0.0
mouse_smoothing = 0.0
mouse_invert_y = false
button_prompts = "auto"
mouse_look = "native"
overlay_key = "F1"
controller_sensitivity = "medium"
controller_invert_y = false
vibration_scale = 1.0

[diagnostics]
camera_state = false
